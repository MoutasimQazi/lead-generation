; PHP limits for this app. cPanel reads .user.ini per-directory under PHP-FPM
; and FastCGI. If your host ignores it, set the same values in
; cPanel → MultiPHP INI Editor.
;
; leads.csv is 48 MB, so the defaults (often 2M–64M) will silently reject it.
; post_max_size must exceed upload_max_filesize, or PHP discards the whole
; request body and $_FILES arrives empty with no error code.

upload_max_filesize = 256M
post_max_size = 260M
memory_limit = 256M

; The importer slices work to fit inside this, then hands control back to the
; browser to call again. Raising it is not required — lowering it below ~30
; just means more, shorter slices.
max_execution_time = 120
max_input_time = 300

; Twenty files per upload, each needing name/type/tmp_name/error/size.
max_file_uploads = 25

; Never render errors into a response; they go to the log and the API returns
; clean JSON instead.
display_errors = Off
log_errors = On
